name: Release

# Builds and publishes installable APKs whenever a v* tag is pushed.
# Signing keys are optional: with repository secrets present the release APK
# is signed; without them it is attached unsigned (debug APK is always fine
# to install directly).
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Optional repository secrets:
#   CHEGHADR_KEYSTORE_B64       base64 of the release .jks
#   CHEGHADR_KEYSTORE_PASSWORD
#   CHEGHADR_KEY_ALIAS
#   CHEGHADR_KEY_PASSWORD

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    name: Build & publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ubuntu-latest ships a preinstalled Android SDK (ANDROID_HOME +
      # cmdline-tools); we only ensure the exact platform/build-tools we need.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" > /dev/null

      - name: Unit tests (gate)
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode signing keystore (if configured)
        id: keystore
        env:
          CHEGHADR_KEYSTORE_B64: ${{ secrets.CHEGHADR_KEYSTORE_B64 }}
        run: |
          if [ -n "$CHEGHADR_KEYSTORE_B64" ]; then
            echo "$CHEGHADR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cheghadr-release.jks"
            echo "path=$RUNNER_TEMP/cheghadr-release.jks" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret found — the release APK will be unsigned."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK (signed when keystore present)
        env:
          CHEGHADR_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          CHEGHADR_KEYSTORE_PASSWORD: ${{ secrets.CHEGHADR_KEYSTORE_PASSWORD }}
          CHEGHADR_KEY_ALIAS: ${{ secrets.CHEGHADR_KEY_ALIAS }}
          CHEGHADR_KEY_PASSWORD: ${{ secrets.CHEGHADR_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Cheghadr-debug-${GITHUB_REF_NAME}.apk"
          RELEASE_APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -n1)
          cp "$RELEASE_APK" "dist/Cheghadr-release-${GITHUB_REF_NAME}.apk"
          ls -la dist/

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
