name: CI

on:
  push:
    branches: [main, web-legacy]
  pull_request:
  workflow_dispatch:

# Minimum required token permissions (blueprint §20.6).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ubuntu-latest ships a preinstalled Android SDK (ANDROID_HOME +
      # cmdline-tools); we only ensure the exact platform/build-tools we need.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Blueprint §20.3: fail visibly when no APK was produced.
      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK was not produced at $APK"
            exit 1
          fi
          ls -la "$APK"

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cheghadr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/intermediates/lint-report*/
            **/build/reports/lint-results*.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- artifact: \`cheghadr-debug-apk\` (retained 14 days)"
          } >> "$GITHUB_STEP_SUMMARY"
