# Project-wide Gradle settings — tuned for the small build container
# (2 CPU / ~4 GB RAM). CI overrides these via GRADLE_BUILD_ACTION or its own env.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
